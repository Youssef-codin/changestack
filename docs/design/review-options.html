<title>Review Options</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400;500;600&family=Hanken+Grotesk:wght@400..700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&display=block">
<style>
/* page chrome */
:root{--pg-bg:#e9e9e6;--pg-fg:#18181b;--pg-mute:#6b6b70;--pg-line:#d2d2cd;--pg-chip:#fafaf8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pg-bg:#0c0c0d;--pg-fg:#ececee;--pg-mute:#8c8c92;--pg-line:#2a2a2e;--pg-chip:#18181b;color-scheme:dark}}
:root[data-theme="dark"]{--pg-bg:#0c0c0d;--pg-fg:#ececee;--pg-mute:#8c8c92;--pg-line:#2a2a2e;--pg-chip:#18181b;color-scheme:dark}
:root.force-light{--pg-bg:#e9e9e6;--pg-fg:#18181b;--pg-mute:#6b6b70;--pg-line:#d2d2cd;--pg-chip:#fafaf8;color-scheme:light}
:root.force-dark{--pg-bg:#0c0c0d;--pg-fg:#ececee;--pg-mute:#8c8c92;--pg-line:#2a2a2e;--pg-chip:#18181b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--pg-bg);color:var(--pg-fg);font:14px/1.5 "Hanken Grotesk",system-ui,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.i{font-family:"Material Symbols Sharp";font-weight:normal;font-style:normal;font-size:18px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:"liga";-webkit-font-smoothing:antialiased;font-variation-settings:"FILL" 0,"wght" 400,"opsz" 20;vertical-align:-4px;flex:none;overflow:hidden;width:1em}
.i.f{font-variation-settings:"FILL" 1,"wght" 500,"opsz" 20}
.picker{position:sticky;top:0;z-index:20;background:var(--pg-bg);border-bottom:1px solid var(--pg-line)}
.picker .in{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1320px;margin:0 auto}
.picker h1{margin:0 10px 0 0;font:700 14px "Hanken Grotesk",sans-serif}
.tab{text-decoration:none;color:inherit;display:inline-flex;align-items:baseline;gap:6px;padding:6px 12px;border:1px solid var(--pg-line);border-radius:999px;background:var(--pg-chip);font-weight:600;font-size:13px}
.tab[aria-current="true"]{background:var(--pg-fg);color:var(--pg-bg);border-color:var(--pg-fg)}
.sp{flex:1}
.bgpick{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--pg-line);border-radius:999px;background:var(--pg-chip);font-size:13px}
.bgpick span{padding:3px 6px 3px 8px;color:var(--pg-mute)}
.bgpick button{padding:3px 10px;border-radius:999px}
.bgpick button[aria-pressed="true"]{background:var(--pg-fg);color:var(--pg-bg)}
.modebtn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--pg-line);border-radius:999px;background:var(--pg-chip);font-size:13px}
.dnote{max-width:1320px;margin:0 auto;padding-block:14px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));color:var(--pg-mute);font-size:14px}
.dnote b{color:var(--pg-fg)}
.stagewrap{max-width:1320px;margin:0 auto;padding-block:14px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.scroller{overflow-x:auto;border:1px solid var(--pg-line);border-radius:20px}
.stage{min-width:1180px}
.stage{--s-core:#e5383b;--s-glue:#f2711c;--s-tests:#f5c400;--s-docs:#4c8df6;--s-boilerplate:#3fae5a;--s-generated:#9a9ca6}
.stage.dark{--s-core:#ff5a5d;--s-glue:#ff8a3d;--s-tests:#ffd43b;--s-docs:#74a8ff;--s-boilerplate:#5cc977;--s-generated:#7d7f89}

/* ================= Riso tokens ================= */
.r{--code:#ffffff;--side:#ececea;--glowA:rgb(255 79 139 / .22);--glowB:rgb(255 176 92 / .18);--grainO:.07;--bg:#f5f5f3;--sf:#ffffff;--ln:#e3e3e0;--tx:#1b1d26;--mu:#6e7079;--pk:#ff4f8b;--pkink:#c92a63;--pkbg:#ffe8f0;--fl:#e03131;--flink:#c92a2a;--flbg:#ffe9e9;--onfl:#fff;--tline:#c9c9c4;--f-risky:#e03131;--f-deviation:#a0592b;--f-untested:#1098ad;--f-uncertain:#c2255c;--cur:#e8e8e5;
  --add:#e3f5e7;--addt:#1d7a3a;--del:#fde9e9;--delt:#b3261e;--kw:#3a46c9;--str:#1d7a3a;--com:#8a8c94;--hov:#ececea;
  background:var(--bg);color:var(--tx);font:15px/1.5 "Geist",system-ui,sans-serif}
.dark .r{--code:#141417;--side:#0b0b0d;--glowA:rgb(255 79 139 / .16);--glowB:rgb(140 90 255 / .10);--grainO:.09;--bg:#101012;--sf:#18181b;--ln:#26262b;--tx:#ececef;--mu:#8e8f97;--pkink:#ff7aa8;--pkbg:#2c1a22;--fl:#ff6b6b;--flink:#ff8787;--flbg:#2c1618;--onfl:#1b1d26;--tline:#3a3a41;--f-risky:#ff6b6b;--f-deviation:#d9915f;--f-untested:#3bc9db;--f-uncertain:#f06595;--cur:#24242a;
  --add:#12261a;--addt:#6fd08f;--del:#2c1517;--delt:#ff8a80;--kw:#9aa5ff;--str:#7fd498;--com:#6f717a;--hov:#1d1d21}

/* top bar, same as Briefing plus verdict chip and progress */
.r .bar{position:relative;z-index:1;display:flex;align-items:center;gap:12px;padding:14px 28px;border-bottom:1px solid var(--ln)}
.r .brand{display:flex;align-items:center;gap:8px;font-weight:600}
.r .brand .i{width:28px;height:28px;border-radius:9px;background:var(--tx);color:var(--bg);display:grid;place-items:center;font-size:18px}
.r .pr{display:inline-flex;align-items:center;gap:4px;background:#1f883d;color:#fff;font:600 13px "Geist Mono";padding:3px 10px 3px 7px;border-radius:999px}
.r .ttl{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:250px}
.r .vchip{display:inline-flex;align-items:center;gap:6px;background:var(--pk);color:#1b1d26;border-radius:999px;padding:3px 3px 3px 9px;font-weight:600;font-size:13px;white-space:nowrap}
.r .vchip b{background:#1b1d26;color:#fff;border-radius:999px;font:600 12px/20px "Geist Mono";padding:0 7px}
.r .prog{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--mu);white-space:nowrap}
.r .prog b{color:var(--tx);font-weight:600}
.r .prog svg{width:22px;height:22px;transform:rotate(-90deg)}
.r .prog circle{fill:none;stroke-width:3.5}
.r .models{display:flex;align-items:center;gap:2px;padding:3px;border-radius:999px;border:1px solid var(--ln)}
.r .models>span{display:flex;align-items:center;padding:0 4px 0 6px;color:var(--mu)}
.r .models button{padding:4px 11px;border-radius:999px;font-size:13px;font-weight:500;color:var(--mu)}
.r .models button.on{background:var(--tx);color:var(--bg)}
.r .submit{display:flex;align-items:center;gap:8px;padding:8px 14px 8px 12px;border-radius:999px;background:var(--pk);color:#1b1d26;font-weight:600;font-size:14px}
.r .submit b{background:#1b1d26;color:#fff;border-radius:999px;font:600 11px/18px "Geist Mono";padding:0 7px}

/* tier tag: filled severity color, dark text */
.r .tier{display:inline-flex;align-items:center;gap:5px;background:var(--c);color:#1b1d26;border-radius:999px;padding:2px 10px 2px 7px;font-size:12px;font-weight:600}
.r .tier .i{font-size:15px}
.r .seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--hov)}
.r .seg button{white-space:nowrap;display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:500;color:var(--mu)}
.r .seg button .i{font-size:16px}
.r .seg button.on{background:var(--pk);color:#1b1d26}

/* file list rows */
.r .k-risky{--fl:var(--f-risky)} .r .k-deviation{--fl:var(--f-deviation)} .r .k-untested{--fl:var(--f-untested)} .r .k-uncertain{--fl:var(--f-uncertain)}
.r .k-risky,.r .k-deviation,.r .k-untested,.r .k-uncertain{--flbg:color-mix(in srgb,var(--fl) 13%,var(--bg))}
.r .grp{width:100%;text-align:left;cursor:pointer;display:flex;align-items:center;gap:8px;margin:16px 0 4px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--mu)}
.r .grp .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.r .grp .i{font-size:16px;color:var(--mu)}
.r .grp.fl>.i:first-child{color:var(--tx)}
.r .gd>summary{list-style:none}
.r .gd>summary::-webkit-details-marker{display:none}
.r .grp .chev,.r .dirrow .chev{color:var(--mu);font-size:18px;margin-left:-4px;margin-right:-5px}
.r .gd:not([open])>summary .chev{rotate:-90deg}
@media (prefers-reduced-motion:no-preference){
  .r .gd>summary .chev{transition:rotate .2s}
  .r .gd::details-content{transition:block-size .25s ease-in-out,content-visibility .25s allow-discrete}
}
.r .gd::details-content{interpolate-size:allow-keywords;overflow:clip;contain:layout}
.r .gd:not([open])::details-content{block-size:0}
.r .grp:hover{color:var(--tx)}
.r .grp em{font-style:normal;margin-left:auto;font:500 12px "Geist Mono";letter-spacing:0;text-transform:none}
.r .fr{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 2px;border-radius:999px;cursor:pointer}
.r .fr:hover{background:var(--hov)}
.r .fr.cur{background:var(--pkbg)}
.r .fr.cur .fname{color:var(--pkink)}
.r .ck{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--ln);display:grid;place-items:center;flex:none}
.r .ck .i{font-size:14px}
.r .fr.rev .ck{background:var(--tx);color:var(--bg);box-shadow:none}
.r .fr.rev .nm b{color:var(--mu);font-weight:500}
.r .nm{min-width:0;flex:1;display:flex;align-items:baseline;gap:6px;overflow:hidden;white-space:nowrap}
.r .nm b{font:500 13px "Geist Mono"}
.r .fname{display:flex;min-width:0;white-space:nowrap}
.r .fname>span{overflow:hidden;text-overflow:ellipsis}
.r .nm small{color:var(--mu);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.r .nm .td{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none;align-self:center}
.r .tb{width:20px;height:20px;border-radius:50%;background:var(--c);color:#1b1d26;display:inline-flex;align-items:center;justify-content:center;flex:none}
.r .tb>.i{display:block;width:auto;height:auto;line-height:1;vertical-align:0}
.r .tb .i,.r .grp .tb .i,.r .dirrow .tb .i{color:#1b1d26}
.r .tb .i{font-size:14px;font-variation-settings:"FILL" 1,"wght" 600,"opsz" 20}
.r .grp .tb{width:22px;height:22px}
.r .tree{position:relative}
.r .kids{position:relative;margin-left:13px;padding-left:9px}
.r .kids::before{content:"";position:absolute;left:0;top:0;bottom:14px;width:1.5px;border-radius:2px;background:var(--tline)}
.r .kids>.fr,.r .kids>.gd>summary{position:relative}
.r .kids>.fr::before,.r .kids>.gd>summary::before{content:"";position:absolute;left:-9px;top:50%;width:7px;height:1.5px;border-radius:2px;background:var(--tline)}
.r .dirrow{width:100%;cursor:pointer;border-radius:999px;display:flex;align-items:center;gap:6px;padding:3px 4px;color:var(--mu);font:12px "Geist Mono";white-space:nowrap}
.r .dirrow .i{font-size:16px}
.r .tsub{font:600 12px "Geist",sans-serif;text-transform:capitalize;color:var(--tx);padding:4px 4px 4px 2px}
.r .tsub .tb{width:18px;height:18px}
.r .tsub .tb .i{font-size:12px}
.r .tsub em{margin-left:auto;font:500 11px "Geist Mono";font-style:normal;color:var(--mu)}


.r .dirrow:hover{background:var(--hov);color:var(--tx)}
.r .fr .tb{margin-left:-2px}
.r .legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:var(--mu)}
.r .legend span{display:inline-flex;align-items:center;gap:4px}
.r .legend .tb{width:16px;height:16px}
.r .legend .tb .i{font-size:11px}
.r .mk{display:flex;gap:5px;align-items:center;flex:none}
.r .mk .dr{display:inline-flex;align-items:center;gap:2px;font:600 11px "Geist Mono";color:var(--mu)}
.r .mk .dr .i{font-size:14px}
.r .mk .fl{width:20px;height:20px;border-radius:50%;background:var(--fl);color:var(--onfl);display:grid;place-items:center}
.r .mk .fl .i{font-size:13px}

/* file header */
.r .fh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.r .path{font:600 15px "Geist Mono"}
.r .path small{font-weight:400;color:var(--mu)}
.r .num{font:500 13px "Geist Mono"}
.r .num .a{color:var(--addt)} .r .num .d{color:var(--delt)}
.r .ptr{display:inline-flex;align-items:center;gap:5px;background:var(--fl);color:var(--onfl);border-radius:999px;padding:4px 11px 4px 8px;font-size:13px;font-weight:500}

.r .ptr .i{font-size:16px}
.r .pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 11px 4px 8px;font-size:13px;color:var(--mu);box-shadow:inset 0 0 0 1px var(--ln)}
.r .pill .i{font-size:16px}
.r .markrev{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 14px 6px 8px;font-size:13px;font-weight:600;color:var(--tx);box-shadow:inset 0 0 0 1px var(--ln)}
.r .markrev .i{font-size:18px;color:var(--pkink)}
.r .markrev:hover{background:var(--pkbg)}
.r .markrev.on{background:var(--pkbg);color:var(--pkink);box-shadow:none}
.r .why{display:flex;gap:8px;align-items:center;color:var(--mu);margin:8px 0 14px}
.r .why .i{color:var(--tx)}
.r .why b{color:var(--tx);font:500 14px "Geist Mono"}
.r .hnote{display:flex;gap:12px;align-items:flex-start;background:var(--flbg);border-radius:18px;padding:12px 16px 12px 12px;margin:10px 0 14px}
.r .hnote .ic{width:32px;height:32px;border-radius:50%;background:var(--fl);color:var(--onfl);display:grid;place-items:center;flex:none}
.r .hnote b{text-transform:capitalize}
.r .hnote p{margin:2px 0 0;color:var(--tx)}

/* diff */
.r .diff{font:13px/24px "Geist Mono",monospace}
.r .hunk{display:flex;align-items:center;gap:6px;color:var(--mu);margin:4px 0 6px;padding-left:4px}
.r .hunk span:last-child{background:var(--hov);border-radius:999px;padding:0 12px;font-size:12px}
.r .ln{display:grid;grid-template-columns:48px 18px 1fr;border-radius:8px;position:relative}
.r .ln>.no{color:var(--mu);text-align:right;padding-right:8px;user-select:none;opacity:.8}
.r .ln.del>.no{opacity:.5}
.r .ln>.sg{text-align:center;padding:0}
.r .ln code{font:inherit;white-space:pre;padding-right:40px}
.r .ln.add{background:var(--add)} .r .ln.add .sg{color:var(--addt)}
.r .ln.del{background:var(--del)} .r .ln.del .sg{color:var(--delt)} .r .ln.del code{opacity:.8}
.r .ln.flg{background:var(--flbg)}
.r .ln.flg>.no{opacity:1}
.r .ln.flg>.no b{display:inline-flex;align-items:center;gap:2px;background:var(--fl);color:var(--onfl);border-radius:999px;padding:0 6px 0 4px;line-height:18px;font-weight:600}
.r .ln.flg>.no b .i{font-size:12px;vertical-align:0}
.r .ln mark{background:none;color:inherit;text-decoration:underline wavy var(--fl);text-underline-offset:4px;text-decoration-thickness:1.5px}
.r .ln .plus{position:absolute;right:8px;top:2px;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#1b1d26;display:none;place-items:center;box-shadow:0 1px 3px rgb(0 0 0 / .18)}
.r .ln .plus .i{font-size:15px}
.r .ln:hover .plus,.r .ln.hovered .plus{display:grid}
.r .kw{color:var(--kw)} .r .st{color:var(--str)} .r .cm{color:var(--com);font-style:italic}
.r .more{display:flex;align-items:center;gap:6px;color:var(--mu);font-size:12px;padding:6px 0 0 66px}

/* notes at the anchor line */
.r .anno{display:grid;grid-template-columns:32px 1fr auto;gap:2px 12px;margin:8px 0 10px 66px;padding:12px 14px 12px 12px;border-radius:18px;font:14px/1.5 "Geist",sans-serif;max-width:640px}
.r .anno .ic{grid-row:1/3;width:32px;height:32px;border-radius:50%;display:grid;place-items:center}
.r .anno .h{display:flex;gap:8px;align-items:baseline}
.r .anno .h span{font:12px "Geist Mono";color:var(--mu)}
.r .anno p{margin:0}
.r .anno .h,.r .anno p{grid-column:2}
.r .anno .acts{grid-row:1/3;grid-column:3;display:flex;gap:4px;color:var(--mu)}
.r .anno .acts button{width:28px;height:28px;border-radius:50%;display:grid;place-items:center}
.r .anno .acts button:hover{background:var(--hov)}
.r .anno.flagn{background:var(--flbg)}
.r .anno.flagn .ic{background:var(--fl);color:var(--onfl)}
.r .anno.flagn b{text-transform:capitalize}
.r .anno.draft{background:var(--sf);box-shadow:inset 0 0 0 1px var(--ln)}
.r .anno.draft .ic{background:var(--tx);color:var(--bg)}
.r .anno.draft .ic .i{font-size:17px}

/* ---------- A: RAIL ---------- */
.v-rail .body{display:grid;grid-template-columns:300px 1px 1fr}
.v-rail .rail{padding:20px 18px 24px 22px}
.v-rail .rail .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.v-rail .vr{background:var(--ln)}
.v-rail .main{padding:24px 32px 40px;min-width:0}
.v-rail .file+.file{margin-top:34px;padding-top:26px;border-top:1px solid var(--ln)}
.v-rail .feathd{display:flex;gap:12px;align-items:center;margin-bottom:22px}
.v-rail .feathd .ic{width:40px;height:40px;border-radius:50%;background:var(--pkbg);color:var(--pkink);display:grid;place-items:center}
.v-rail .feathd b{font-size:17px}
.v-rail .feathd p{margin:0;color:var(--mu);font-size:14px}
.r .keys{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:22px;font-size:12px;color:var(--mu)}
.r .keys kbd{font:500 11px "Geist Mono";background:var(--hov);border-radius:6px;padding:1px 6px;color:var(--tx)}

/* ---------- B: FOCUS ---------- */
.v-focus{display:flex;flex-direction:column;height:900px}
.v-focus .band{background:var(--pk);color:#1b1d26;padding:24px 32px 22px;display:grid;grid-template-columns:1fr auto;gap:10px 32px;align-items:end}
.v-focus .band .k{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;opacity:.8}
.v-focus .band h2{margin:4px 0 0;font:600 40px/1.05 "Geist";letter-spacing:-.035em;display:flex;align-items:baseline;gap:12px}
.v-focus .band h2 small{font:400 16px "Geist Mono";letter-spacing:0;opacity:.7}
.v-focus .band .why{color:#1b1d26;margin:8px 0 0;opacity:.85}
.v-focus .band .why .i,.v-focus .band .why b{color:#1b1d26}
.v-focus .band .num .a,.v-focus .band .num .d{color:#1b1d26;opacity:.75}
.v-focus .band .tier{background:rgb(255 255 255 / .9)}
.v-focus .band .tier i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.v-focus .band .acts{display:flex;flex-direction:column;align-items:flex-end;gap:10px}

.v-focus .bigrev{display:flex;align-items:center;gap:14px;padding:10px 10px 10px 20px;border-radius:999px;background:#1b1d26;color:#fff;font-weight:600;font-size:16px}
.v-focus .bigrev .go{width:36px;height:36px;border-radius:50%;background:#fff;color:#1b1d26;display:grid;place-items:center}
.v-focus .bigrev small{display:block;font:400 12px "Geist Mono";opacity:.6}
.v-focus .scrollc{flex:1;overflow:auto;padding:22px 32px 30px}
.v-focus .scrollc .diff{max-width:1000px;margin:0 auto}
.v-focus .dock{display:flex;align-items:center;gap:16px;padding:12px 24px;border-top:1px solid var(--ln);background:var(--bg)}
.v-focus .step{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--ln)}
.v-focus .step.next{background:var(--tx);color:var(--bg);box-shadow:none}
.v-focus .dots{flex:1;display:flex;align-items:center;justify-content:center;gap:14px}

function tree(fs, id) {

    while (!d.files.length && Object.keys(d.dirs).length === 1) { const [k, v] = Object.entries(d.dirs)[0]; name += "/" + k; d = v; }

            <button class="ntog2" data-ntog>${I("sticky_note_2")}Notes<em>4</em>${I(notesOpen ? "chevron_right" : "chevron_left")}</button><div class="nhead"><span class="lbl">${I("sticky_note_2")}Notes<em>4</em></span></div><button class="nbtn" data-ntog data-n="4" title="${notesOpen ? "Hide notes" : "Show notes"}" aria-label="${notesOpen ? "Hide notes" : "Show notes"}">${I(notesOpen ? "chevron_right" : "chevron_left")}</button></div>
          ${fileSec(2, FILES[1], ptr("deviation", "alt_route", ", line 14"), CWHY, inlineDiff(CONFIRM, false), cNotes)}
          ${fileSec(3, FILES[2], ptr("untested", "science_off", ""), XWHY, `<div class="diff">${CANCEL.map(row).join("")}</div><div class="more">${I("unfold_more")}42 more lines</div>`, xNotes)}
        </main>
      </div></div>`;
    },
  },
};

/* ---------- page logic ---------- */
const WHY_OPTS = [["side", "Next to the divider"], ["outline", "In the list"], ["under", "Under the name"]];
const WHY_NOTE = {
  side: "<b>Why, next to the divider</b>: the <b>Why this file</b> card opens the margin, level with the file's divider, whose rule runs on into it. Below it, <b>In this file</b> lists the functions and types the file changes with their lines (click to jump; the one on screen is pink).",
  outline: "<b>Why, in the list</b>: no card; each function's why sits under it in the In this file list.",
  under: "<b>Why, under the name</b>: the why stays under the header in the code column, as built; the margin has only the In this file list.",
};
const order = ["margin"];
const stage = document.getElementById("stage");
const drawOpts = () => (document.getElementById("opts").innerHTML =
  `<span class="optgrp"><span>Why this file</span>${WHY_OPTS.map(([k, n]) => `<button data-nv="${k}" aria-pressed="${k === whyV}">${n}</button>`).join("")}</span>`);
function isDark() {
  const r = document.documentElement;
  if (r.classList.contains("force-dark")) return true;
  if (r.classList.contains("force-light")) return false;
  if (r.dataset.theme) return r.dataset.theme === "dark";
  return matchMedia("(prefers-color-scheme: dark)").matches;
}
function show() {
  const k = "margin";
  drawOpts();
  document.getElementById("note").innerHTML = WHY_NOTE[whyV];
  stage.className = "stage" + (isDark() ? " dark" : "");
  stage.innerHTML = DIRS[k].html();
  placeNotes();
}
/* each margin note starts level with its line (measured, not guessed); notes on nearby lines stack below */
function placeNotes() {
  stage.querySelectorAll(".v-margin .notes").forEach((col) => {
    const top0 = col.getBoundingClientRect().top, grid = col.closest(".grid");
    let y = 0;
    col.querySelectorAll(".note, .mk2").forEach((n) => {
      const row = n.dataset.l && grid.querySelector(`.ln[data-l="${n.dataset.l}"]`);
      /* open notes stack from the top of the file; folded markers sit level with their line */
      const t = n.classList.contains("note") ? y : Math.max(row ? row.getBoundingClientRect().top - top0 : 0, y);
      n.style.top = t + "px";
      y = t + n.offsetHeight + (n.classList.contains("note") ? 16 : 4);
    });
    col.style.minHeight = y + "px";
  });
}
document.fonts && document.fonts.ready.then(placeNotes);
addEventListener("resize", placeNotes);
document.getElementById("opts").addEventListener("click", (e) => {
  const nv = e.target.closest("[data-nv]"), sv = e.target.closest("[data-sv]");
  if (nv) { whyV = nv.dataset.nv; show(); }
  if (sv) { startV = sv.dataset.sv; show(); }
});
stage.addEventListener("click", (e) => {
  const m = e.target.closest("[data-mode]");
  if (m) { byFeature = m.dataset.mode === "feat"; show(); return; }
  const rs = e.target.closest("[data-res]");
  if (rs) { const k = rs.dataset.res; resolved.has(k) ? resolved.delete(k) : resolved.add(k); show(); return; }
  if (e.target.closest("[data-ntog]")) { notesOpen = !notesOpen; show(); return; }
  const b = e.target.closest(".markrev");
  if (b) { const on = !b.classList.contains("on"); b.outerHTML = markRev(on); }
});
const lite = (e, on) => { const n = e.target.closest(".note[data-l], .mk2[data-l]"); if (!n || !n.dataset.l) return; n.closest(".grid").querySelectorAll(`.ln[data-l="${n.dataset.l}"]`).forEach((r) => r.classList.toggle("lit", on)); };
stage.addEventListener("mouseover", (e) => lite(e, true));
stage.addEventListener("mouseout", (e) => lite(e, false));
/* remember which groups are folded across re-renders; toggle does not bubble, hence capture */
stage.addEventListener("toggle", (e) => { const d = e.target; if (d.matches?.("details[data-col]")) d.open ? shut.delete(d.dataset.col) : shut.add(d.dataset.col); }, { capture: true });
const BGS = [["plain", "Plain"], ["glow", "Glow"], ["grain", "Glow + grain"]];
const drawBg = () => document.getElementById("bgpick").innerHTML = `<span>Background</span>` + BGS.map(([k, n]) => `<button data-bg="${k}" aria-pressed="${k === bgMode}">${n}</button>`).join("");
addEventListener("hashchange", show);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", show);
document.getElementById("mode").addEventListener("click", () => {
  const r = document.documentElement, d = isDark();
  r.classList.toggle("force-dark", !d); r.classList.toggle("force-light", d);
  show();
});
show();
</script>
